<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gemini-icon-gen demo</title>
  </head>
  <body class="min-h-screen bg-neutral-50 text-neutral-900">
    <div class="mx-auto max-w-5xl px-4 py-8">
      <header class="mb-8">
        <h1 class="text-2xl font-semibold text-brand-900">gemini-icon-gen demo</h1>
        <p class="mt-1 text-sm text-neutral-600">
          Upload reference images, edit the prompt, and generate a
          style-matched icon with Google's Gemini image API.
        </p>
      </header>

      <main class="grid gap-8 md:grid-cols-2">
        <section aria-labelledby="form-heading" class="space-y-6">
          <h2 id="form-heading" class="sr-only">Icon generation form</h2>

          <form id="generate-form" class="space-y-6">
          <div>
            <span class="mb-2 block text-sm font-medium">Reference images</span>
            <div
              id="dropzone"
              role="button"
              tabindex="0"
              class="flex flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed border-neutral-300 p-6 text-center focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
            >
              <p class="text-sm text-neutral-600">
                Drag &amp; drop images here, or
                <span class="font-medium text-brand-700 underline">click to upload</span>
              </p>
              <p class="text-xs text-neutral-500">PNG, JPG, or WEBP</p>
            </div>
            <input
              id="file-input"
              type="file"
              multiple
              accept="image/png,image/jpeg,image/webp"
              aria-label="Upload reference images"
              class="sr-only"
            />
            <ul
              id="thumbnail-list"
              class="mt-3 grid grid-cols-4 gap-2"
              aria-label="Selected reference images"
            ></ul>
          </div>

          <div>
            <label for="prompt" class="mb-2 block text-sm font-medium">System prompt</label>
            <textarea
              id="prompt"
              rows="8"
              class="w-full rounded-lg border border-neutral-300 p-3 font-mono text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
            ></textarea>
          </div>

          <div>
            <label for="subject" class="mb-2 block text-sm font-medium">Subject</label>
            <input
              id="subject"
              type="text"
              required
              placeholder="e.g. CO2 Laser Engraver"
              class="w-full rounded-lg border border-neutral-300 p-2.5 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
            />
          </div>

          <div>
            <label for="style-notes" class="mb-2 block text-sm font-medium">
              Style notes <span class="font-normal text-neutral-500">(optional)</span>
            </label>
            <input
              id="style-notes"
              type="text"
              placeholder="e.g. Include a small flame icon in the corner"
              class="w-full rounded-lg border border-neutral-300 p-2.5 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
            />
          </div>

          <button
            id="generate-button"
            type="submit"
            class="w-full rounded-lg bg-brand-700 px-4 py-2.5 font-medium text-white hover:bg-brand-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
          >
            Generate icon
          </button>
          </form>
        </section>

        <section aria-labelledby="result-heading" class="space-y-3">
          <h2 id="result-heading" class="sr-only">Result</h2>
          <div id="result-status" role="status" aria-live="polite" class="text-sm text-neutral-600"></div>
          <div
            id="result-panel"
            class="flex min-h-64 items-center justify-center rounded-lg border border-neutral-200 bg-white p-4"
          >
            <p class="text-sm text-neutral-400">No icon generated yet.</p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
