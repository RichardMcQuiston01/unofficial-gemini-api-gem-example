# Convenience wrapper around the demo Dockerfile.
#
#   GEMINI_API_KEY=your-key docker compose up --build
#
# or put GEMINI_API_KEY (and optionally GEMINI_IMAGE_MODEL / DEMO_PORT) in a
# .env file next to this one — Compose loads it automatically.
services:
  demo:
    build: .
    ports:
      - "${DEMO_PORT:-3000}:3000"
    environment:
      # Required — the container exits immediately if this is unset.
      GEMINI_API_KEY: "${GEMINI_API_KEY:?set GEMINI_API_KEY in your environment or .env file}"
      # Optional — overrides the default image-generation model.
      GEMINI_IMAGE_MODEL: "${GEMINI_IMAGE_MODEL:-}"
