name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs without GEMINI_API_KEY on purpose — the suite mocks the Gemini
      # client, so CI never needs a live key.
      - name: Run tests
        run: bun run test

      - name: Typecheck package
        run: bun run typecheck

      - name: Typecheck demo
        run: bun run demo:typecheck

      - name: Build package
        run: bun run build

      - name: Build demo frontend
        run: bun run demo:build
