name: Release

# Publishes the package to npm when a GitHub Release is published.
# Cut a release from a tag (e.g. v0.1.0) whose version matches package.json;
# the version-match check below fails the run if they disagree.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: Build, verify & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Node provides npm (with provenance support) and wires up the registry
      # auth token; Bun is used for install/test/build to match local dev.
      - name: Set up Node (npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the release tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag" ]; then
            echo "Release tag ($tag) does not match package.json version ($pkg_version)." >&2
            exit 1
          fi

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      # prepublishOnly rebuilds too; --access public and --provenance are also
      # driven by publishConfig + this flag. NODE_AUTH_TOKEN authenticates.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
